<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>링크 미리보기 카드</title>
  <!-- 카카오톡·슬랙 등에서 링크를 보낼 때 뜨는 미리보기 이미지(1200×630).
       build-pdf.ps1 이 이 페이지를 캡처해 assets/img/og.png 로 저장한다. 내용은 data/resume.js 에서 읽는다. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: "Pretendard Variable", "Malgun Gothic", sans-serif;
      background: #faf8f5;
      color: #1c1917;
      word-break: keep-all;
      display: grid;
      grid-template-columns: 1fr 360px;
      align-items: center;
      padding: 0 80px;
      position: relative;
    }
    body::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #c2410c; }
    .title { font-size: 26px; font-weight: 700; color: #c2410c; }
    .headline { margin-top: 22px; font-size: 50px; font-weight: 800; line-height: 1.25; letter-spacing: -0.03em; }
    .name { margin-top: 40px; font-size: 32px; font-weight: 800; }
    .name span { margin-left: 10px; font-size: 24px; font-weight: 700; color: #c2410c; }
    .url { margin-top: 8px; font-size: 22px; color: #6b635b; }
    .avatar {
      width: 320px; height: 320px; border-radius: 50%;
      object-fit: cover; justify-self: end;
      border: 8px solid #fff;
      box-shadow: 0 0 0 1px #e8e2da, 0 24px 48px rgba(194, 65, 12, 0.22);
    }
  </style>
</head>
<body>
  <div>
    <p class="title" id="title"></p>
    <p class="headline" id="headline"></p>
    <p class="name" id="name"></p>
    <p class="url" id="url"></p>
  </div>
  <img class="avatar" id="avatar" alt="">

  <script src="../data/resume.js"></script>
  <script src="../assets/common.js"></script>
  <script>
    const p = RESUME.profile;
    document.getElementById("title").textContent = p.title;
    document.getElementById("headline").innerHTML = R.md(p.headline);
    document.getElementById("name").innerHTML = `${R.escapeHtml(p.name)}<span>${R.escapeHtml(p.nameEn)}</span>`;
    document.getElementById("url").textContent = RESUME.meta.webUrl.replace(/^https?:\/\//, "").replace(/\/$/, "");
    document.getElementById("avatar").src = "../" + p.caricature;
  </script>
</body>
</html>
